<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag (gtag.js) -->

  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-LZD9DR8ZX5');

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | KSC</title>
<meta name="description" content="KSC sports card catalog. Online only, based in Mankato, Minnesota.">
<style>
/*gravel*/
a{color:black;outline:0;text-decoration:none;}
a:hover{text-decoration:underline;}
body{background:#f7f7f7;font-family:arial;font-size:16px;}
footer{color:gray;font-size:13px;margin:50px 0;text-align:center;}
header{}
header p{margin:5px;}
.box{background:white;border:1px solid lightgray; margin:5px;padding:5px;}
.box a{display:block;margin-left:5px;}
.box p{font-weight:bold;margin:0px 5px 5px 5px;}
.content{display:flex;flex-direction:column;}
.col{margin:10px 0;width:99%;}
.row{background:white;border:1px solid lightgray;text-align:center;width:100%;}

@media (min-width:700px){
body{margin:11px 200px;}
.content{flex-direction:row;}
}

/*not gravel */
body{line-height:1.5;}
.alert{border:1px solid red;padding:5p;text-align:center;}
.alert a{color:red;}

/* shop-specific */
#collection{display:flex;flex-direction:column;}
.breadcrumbs{color:gray;font-size:13px;margin:10px 5px;}
.breadcrumbs a{color:black;}
.breadcrumbs span{margin:0 5px;}
.collection-heading{background:white;border:1px solid lightgray;margin:5px;padding:5px;}
.collection-heading>div{display:flex;justify-content:space-between;align-items:center;}
.collection-heading h1{margin:5px 0;}
#product-count{color:gray;font-size:13px;}
.sort{display:inline-block;margin:10px 0;}
.sort select{font-family:arial;font-size:16px;}
#products{display:flex;flex-wrap:wrap;margin:5px 0;}
.product{background:white;border:1px solid lightgray;margin:5px;padding:5px;flex:1;min-width:200px;max-width:250px;}
.product-image{background:#f0f0f0;width:100%;height:200px;display:flex;align-items:center;justify-content:center;margin-bottom:5px;overflow:hidden;}
.product-image img{width:100%;height:100%;object-fit:cover;}
.product-image.blank{color:gray;font-size:13px;}
.crop{width:100%;height:100%;overflow:hidden;}
.product h2{font-size:16px;margin:5px 0;font-weight:bold;}
.product .price{font-weight:bold;margin:5px 0;}
#empty{background:white;border:1px solid lightgray;margin:5px;padding:5px;color:gray;}
#empty a{text-decoration:underline;}
noscript{background:white;border:1px solid lightgray;margin:5px;padding:5px;display:block;color:red;}
dialog{font-family:arial;font-size:16px;}
dialog::backdrop{background:rgba(0,0,0,0.5);}
dialog button.close{background:none;border:none;font-size:24px;cursor:pointer;float:right;}
dialog h2{margin-top:0;}
</style>
<script src="products.js" defer></script>
<script src="shop.js" defer></script>
</head>
<body>
<h1>KSC</h1>

<div class="box">
<p>Shop</p>
<a href="/">Home</a>
<a href="?category=All">Catalog</a>
<a href="?category=Football">Football</a>
<a href="?category=Baseball">Baseball</a>
</div>

<div id="collection">
<div class="breadcrumbs"><a href="/">Home</a><span>›</span><span id="breadcrumb">Football</span></div>
<div class="collection-heading">
<div><h1 id="collection-title">Football</h1><span id="product-count" role="status"></span></div>
<label class="sort">Sort by <select id="sort"><option value="featured">Featured</option><option value="az">A–Z</option><option value="za">Z–A</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select></label>
</div>
<input type="text" id="search" placeholder="Search products..." style="background:white;border:1px solid lightgray;margin:5px;padding:5px;font-family:arial;font-size:16px;width:calc(100% - 22px);">
<div id="products"></div>
<p id="empty" hidden>No products found. Try another search or browse the <a href="?category=All">full catalog</a>.</p>
<noscript>Please enable JavaScript to display the products.</noscript>
</div>

<footer>
&copy; 2026 Kato Sports Cards (KSC). All Rights Reserved. Mankato, Minnesota
</footer>

<dialog id="info"><form method="dialog"><button class="close" aria-label="Close">×</button></form><h2 id="info-title"></h2><p id="info-text"></p></dialog>
</body>
</html>
