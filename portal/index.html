<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Portal | KSC</title>
    <meta name="description" content="Access the KSC Portal for authenticated user tools and account options.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Kato Sports Cards, sports cards, rookie cards, trading cards, card release dates, card comps, hobby cards, sports card news">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Portal | KSC">
    <meta property="og:description" content="Portal | KSC from Kato Sports Cards. Sign in to access portal tools, account options, and collector services.">
    <meta property="og:url" content="https://kscmn.com/portal">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Portal | KSC",
      "url": "https://kscmn.com/portal",
      "description": "Portal | KSC from Kato Sports Cards. Sign in to access portal tools, account options, and collector services."
    }
    </script>

    <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
<p>KSC Portal</p>
</header>

<p class="breadcrumbs"><a href="/">Home</a> / <span>Portal | KSC</span></p>

<div class="content">
<p>Welcome to the KSC Portal. Sign in to access portal tools and your account.</p>

<button id="loginButton" class="btn">Sign in with Google</button>

<div id="userInfo" style="display:none; margin-top:20px;">
    <p id="status"></p>
    <button id="signOutButton" class="btn">Sign Out</button>
</div>

</div>

<footer>
<p>&copy; 2026 Kato Sports Cards (KSC). All Rights Reserved. Mankato, Minnesota</p>
<a href="/about">About Us</a> |
<a href="/privacy">Privacy Policy</a> |
<a href="/appprivacypolicy">Sports Card DB Privacy Policy</a> |
<a href="/portal">Portal</a> |
<a href="/shop">Shop</a>
</footer>

<script>
const loginButton = document.getElementById('loginButton');
const signOutButton = document.getElementById('signOutButton');
const userInfo = document.getElementById('userInfo');
const statusText = document.getElementById('status');

const CLIENT_ID = '577417709124-kec5rrio32urm627n6lptqkb7dl9att3.apps.googleusercontent.com';
const REDIRECT_URI = 'https://kscmn.com/portal/index.html';
const SCOPE = 'openid profile email';

function buildAuthUrl() {
    const authEndpoint = 'https://accounts.google.com/o/oauth2/v2/auth';
    const params = new URLSearchParams({
        client_id: CLIENT_ID,
        redirect_uri: REDIRECT_URI,
        response_type: 'token id_token',
        scope: SCOPE,
        include_granted_scopes: 'true',
        state: 'portal',
        nonce: 'ksc-' + Math.random().toString(36).slice(2)
    });
    return `${authEndpoint}?${params.toString()}`;
}

function parseHashParams() {
    const hash = window.location.hash.substring(1);
    return Object.fromEntries(new URLSearchParams(hash));
}

function showUser(user) {
    loginButton.style.display = 'none';
    userInfo.style.display = 'block';
    statusText.textContent = `Signed in as ${user.name} (${user.email})`;
}

function showSignedOut() {
    loginButton.style.display = 'inline-block';
    userInfo.style.display = 'none';
    statusText.textContent = '';
}

function handleAuthResponse() {
    const params = parseHashParams();
    if (params.id_token) {
        const tokenParts = params.id_token.split('.');
        if (tokenParts.length === 3) {
            try {
                const payload = JSON.parse(atob(tokenParts[1].replace(/-/g, '+').replace(/_/g, '/')));
                showUser({ name: payload.name || 'Portal User', email: payload.email || 'Unknown' });
                window.history.replaceState({}, document.title, window.location.pathname);
                return;
            } catch (err) {
                console.error('Invalid token payload', err);
            }
        }
    }
    showSignedOut();
}

loginButton.addEventListener('click', () => {
    window.location.href = buildAuthUrl();
});

signOutButton.addEventListener('click', () => {
    showSignedOut();
    window.location.hash = '';
});

window.addEventListener('load', handleAuthResponse);
</script>
</body>
</html>
